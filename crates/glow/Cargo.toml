[package]
name = "spitfire-glow"
version = "0.38.0"
edition = "2024"
authors = ["Patryk 'PsichiX' Budzynski <psichix@gmail.com>"]
description = "GLOW renderer module for Spitfire toolset"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/PsichiX/spitfire"
repository = "https://github.com/PsichiX/spitfire"
documentation = "https://docs.rs/spitfire-glow"
readme = "../../README.md"

[features]
debug_automatic_glGetError = ["glow/debug_automatic_glGetError"]

[dependencies]
spitfire-core = { version = "0.38", path = "../core" }
bytemuck = { version = "1", features = ["derive"] }
glow = "0.18"
vek = "0.17"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "PointerEvent",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
